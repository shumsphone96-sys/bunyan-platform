<body>
  <section id="loginView" class="auth-view">
    <form id="loginForm" class="auth-card" novalidate>
      <div class="brand-mark">ب</div><p class="eyebrow">بُنْيَان OS</p><h1>دخول الإدارة</h1>
      <label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label>
      <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" minlength="10" required></label>
      <button class="primary" type="submit">دخول</button>
      <p id="loginMessage" class="message" role="status">جاهز لتسجيل الدخول.</p>
    </form>
  </section>
  <section id="appView" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="قائمة الإدارة">
      <div class="sidebar-head">
        <div class="sidebar-brand"><div class="brand-mark small">ب</div><div><strong>بُنْيَان OS</strong><small>الإدارة V2</small></div></div>
        <button id="logoutButton" class="danger sidebar-logout">تسجيل الخروج</button>
      </div>
      <nav id="adminNav">
        <button data-view="dashboard" class="active">نظرة عامة</button>
        <button data-view="help">طلبات المساعدة <span id="helpBadge" class="badge">0</span></button>
        <button data-view="participation">طلبات المشاركة <span id="participationBadge" class="badge">0</span></button>
        <button data-view="donations">التبرعات</button><button data-view="finance">المركز المالي</button><button data-view="projects">المشروعات</button><button data-view="beneficiaries">المستفيدون</button><button data-view="volunteers">المتطوعون</button><button data-view="news">الأخبار</button><button data-view="users">المستخدمون والصلاحيات</button><button data-view="audit">سجل النشاط</button><button data-view="backup">النسخ الاحتياطي</button><button data-view="settings">إعدادات النظام</button>
      </nav>
      <div class="sidebar-foot"><a href="../" class="ghost">عرض الموقع</a></div>
    </aside>
    <main class="main"><header class="topbar"><button id="menuButton" class="menu-button" aria-label="فتح قائمة الإدارة">☰</button><div><p class="eyebrow">لوحة الإدارة المستقلة</p><h2 id="pageTitle">نظرة عامة</h2></div><button id="refreshButton" class="ghost">تحديث</button></header><div id="content" class="content" aria-live="polite"></div></main>
    <button id="backdrop" class="backdrop" aria-label="إغلاق القائمة" hidden></button>
  </section>

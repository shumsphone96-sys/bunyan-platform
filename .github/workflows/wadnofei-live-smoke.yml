name: Wad Nofei Live Smoke

on:
  push:
    branches:
      - wadnofei-v73-cloudflare-preview
    paths:
      - '.github/workflows/wadnofei-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit live membership pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://members.shamsphone.net"

          check_code() {
            path="$1"
            code=$(curl -L --max-redirs 5 --connect-timeout 10 --max-time 30               --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$path")
            echo "$path -> HTTP $code"
            if [ "$code" -ge 500 ] || [ "$code" -lt 200 ]; then
              echo "::error::$path returned HTTP $code"
              exit 1
            fi
          }

          check_code /membership
          check_code /track-membership
          check_code /club-admin
          check_code /club-admin/command-center
          check_code /club-admin/release-readiness

          membership=$(curl -L --max-redirs 5 --connect-timeout 10 --max-time 30 --silent --show-error "$base/membership")
          tracker=$(curl -L --max-redirs 5 --connect-timeout 10 --max-time 30 --silent --show-error "$base/track-membership")

          printf '%s' "$membership" | grep -q "متابعة الطلب والعضوية"
          printf '%s' "$tracker" | grep -q "متابعة الطلب والعضوية"
          echo "LIVE_SMOKE_OK"

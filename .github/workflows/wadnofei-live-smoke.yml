name: Wad Nofei Live Smoke

on:
  push:
    branches:
      - wadnofei-v73-cloudflare-preview
    paths:
      - '.github/workflows/wadnofei-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live HTTP
        shell: bash
        run: |
          set -euo pipefail
          base="https://members.shamsphone.net"
          for path in /membership /track-membership /club-admin /club-admin/command-center /club-admin/release-readiness; do
            code=$(curl -L --max-redirs 5 --connect-timeout 10 --max-time 30               --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$path")
            echo "$path -> HTTP $code"
            test "$code" -ge 200
            test "$code" -lt 500
          done

      - name: Verify V73 public content
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 30 "https://members.shamsphone.net/membership" | grep -q "متابعة الطلب والعضوية"
          curl -fsSL --connect-timeout 10 --max-time 30 "https://members.shamsphone.net/track-membership" | grep -q "متابعة الطلب والعضوية"
          echo "LIVE_SMOKE_OK"

name: Wad Nofei Live Smoke

on:
  push:
    branches:
      - wadnofei-v73-cloudflare-preview
    paths:
      - '.github/workflows/wadnofei-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit live membership pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://members.shamsphone.net"
          for path in /membership /track-membership /club-admin /club-admin/command-center /club-admin/release-readiness; do
            code=$(curl -L --max-redirs 5 --connect-timeout 10 --max-time 30               --silent --show-error --output "/tmp/wdn$(echo "$path" | tr '/' '_').html"               --write-out '%{http_code}' "$base$path")
            echo "$path -> HTTP $code"
            if [ "$code" -ge 500 ] || [ "$code" -lt 200 ]; then
              echo "::error::$path returned HTTP $code"
              exit 1
            fi
          done
          grep -q "متابعة الطلب والعضوية" /tmp/wdn_membership.html
          grep -q "متابعة الطلب والعضوية" /tmp/wdn_track-membership.html
          echo "LIVE_SMOKE_OK"

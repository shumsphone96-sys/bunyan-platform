name: WadNofei Membership Quality

on:
  push:
    branches: [wadnofei-cloudflare, fix/wadnofei-rbac-stability-20260921]
    paths:
      - 'wadnofei-membership-cloudflare/**'
      - '.github/workflows/wadnofei-membership-quality.yml'
  pull_request:
    branches: [wadnofei-cloudflare]
    paths:
      - 'wadnofei-membership-cloudflare/**'
      - '.github/workflows/wadnofei-membership-quality.yml'

permissions:
  contents: read

concurrency:
  group: wadnofei-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve reviewed source only (not a production database backup)
        run: |
          mkdir -p /tmp/wdn-evidence
          git rev-parse HEAD > /tmp/wdn-evidence/source-commit.txt
          git archive --format=tar HEAD wadnofei-membership-cloudflare > /tmp/wdn-evidence/reviewed-source.tar
      - name: Run isolated regression tests
        run: |
          set -o pipefail
          node --experimental-vm-modules --test wadnofei-membership-cloudflare/tests/*.test.mjs | tee /tmp/wdn-evidence/regression.txt
      - name: Install existing build dependencies
        working-directory: wadnofei-membership-cloudflare
        run: npm install --no-audit --no-fund
      - name: Compile only - never upload or deploy
        working-directory: wadnofei-membership-cloudflare
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir /tmp/wdn-compiled | tee /tmp/wdn-evidence/compile.txt
      - name: Store test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wadnofei-review-${{ github.sha }}
          path: /tmp/wdn-evidence/
          retention-days: 7

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>لوحة بُنْيَان V2</title><link rel="stylesheet" href="./styles.css?v=3"></head><body class="dashboard"><header class="dash-header"><div class="brand"><span class="mark">ب</span><span><strong id="brand">بُنْيَان V2</strong><small id="sub">لوحة الإدارة</small></span></div><div style="display:flex;gap:10px"><a class="logout" id="siteLink" href="./?lang=ar">عرض الموقع</a><button class="logout" id="logout" type="button">تسجيل الخروج</button></div></header><main class="dash-main"><section class="dash-shell"><div class="dash-toolbar"><div><span class="eyebrow" id="phase">المرحلة الثالثة</span><h1 id="title">طلبات المساعدة</h1><p id="text">استعراض الطلبات وتحديث حالتها وملاحظات الإدارة.</p></div><button class="logout" style="color:#14231f;border-color:#ccd6d1" id="refresh" type="button">تحديث</button></div><div id="requestList" class="request-list"><p class="loading">جارٍ التحميل...</p></div></section></main><script>(()=>{'use strict';const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';const token=localStorage.getItem('bunyan_v2_token');const origin=localStorage.getItem('bunyan_v2_api_origin')||'https://api.bunyan-sudan.org';if(!token){location.replace('./admin.html?lang='+lang);return}const c={ar:{brand:'بُنْيَان V2',sub:'لوحة الإدارة',logout:'تسجيل الخروج',site:'عرض الموقع',phase:'المرحلة الثالثة',title:'طلبات المساعدة',text:'استعراض الطلبات وتحديث حالتها وملاحظات الإدارة.',refresh:'تحديث',loading:'جارٍ التحميل...',empty:'لا توجد طلبات مساعدة بعد.',error:'تعذر تحميل الطلبات.',save:'حفظ التحديث',notes:'ملاحظات الإدارة',amount:'المبلغ المطلوب',created:'تاريخ الطلب',statuses:{new:'جديد',review:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض',completed:'مكتمل'}},en:{brand:'BUNYAN V2',sub:'Admin Dashboard',logout:'Sign Out',site:'View Website',phase:'Phase Three',title:'Help Requests',text:'Review requests and update their status and administration notes.',refresh:'Refresh',loading:'Loading...',empty:'No help requests yet.',error:'Unable to load requests.',save:'Save Update',notes:'Admin notes',amount:'Requested amount',created:'Submitted',statuses:{new:'New',review:'Under Review',approved:'Approved',rejected:'Rejected',completed:'Completed'}}}[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';brand.textContent=c.brand;sub.textContent=c.sub;logout.textContent=c.logout;siteLink.textContent=c.site;siteLink.href='./?lang='+lang;phase.textContent=c.phase;title.textContent=c.title;text.textContent=c.text;refresh.textContent=c.refresh;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const date=v=>new Intl.DateTimeFormat(lang==='ar'?'ar-SD':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));async function api(path,options={}){const res=await fetch(origin+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})},cache:'no-store'});const data=await res.json().catch(()=>({}));if(res.status===401){localStorage.removeItem('bunyan_v2_token');location.replace('./admin.html?lang='+lang);throw new Error('unauthorized')}if(!res.ok)throw new Error(data.error||String(res.status));return data}function card(r){const options=Object.entries(c.statuses).map(([v,l])=>`<option value="${v}" ${r.status===v?'selected':''}>${l}</option>`).join('');const amount=r.requested_amount?`${Number(r.requested_amount).toLocaleString(lang==='ar'?'ar-SD':'en-GB')} ${esc(r.currency)}`:'—';return `<article class="request-item" data-id="${esc(r.id)}"><div class="row"><div><span class="status-pill">${esc(r.tracking_number)}</span><h3>${esc(r.full_name)}</h3></div><strong>${esc(c.statuses[r.status]||r.status)}</strong></div><p><b>${esc(r.case_type)}</b> — ${esc(r.location)} — ${esc(r.phone)}</p><p>${esc(r.description)}</p><div class="meta"><span>${c.amount}: ${amount}</span><span>${c.created}: ${date(r.created_at)}</span></div><div class="request-actions"><select class="status-select">${options}</select><textarea class="notes-input" rows="2" placeholder="${c.notes}">${esc(r.admin_notes||'')}</textarea><button class="save-btn" type="button">${c.save}</button></div><p class="message item-message"></p></article>`}async function load(){requestList.innerHTML=`<p class="loading">${c.loading}</p>`;try{const rows=await api('/api/help/requests');requestList.innerHTML=rows.length?rows.map(card).join(''):`<p class="loading">${c.empty}</p>`;document.querySelectorAll('.save-btn').forEach(btn=>btn.addEventListener('click',save))}catch(e){console.error(e);requestList.innerHTML=`<p class="loading error">${c.error}</p>`}}async function save(e){const item=e.currentTarget.closest('.request-item');const msg=item.querySelector('.item-message');e.currentTarget.disabled=true;msg.textContent=c.loading;try{await api('/api/help/requests/'+item.dataset.id,{method:'PATCH',body:JSON.stringify({status:item.querySelector('.status-select').value,adminNotes:item.querySelector('.notes-input').value})});msg.className='message success item-message';msg.textContent=c.save;await load()}catch(err){console.error(err);msg.className='message item-message';msg.textContent=c.error}finally{e.currentTarget.disabled=false}}refresh.addEventListener('click',load);logout.addEventListener('click',()=>{localStorage.removeItem('bunyan_v2_token');localStorage.removeItem('bunyan_v2_api_origin');location.replace('./admin.html?lang='+lang)});load();})();</script></body></html>

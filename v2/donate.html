<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>التبرع لبُنْيَان</title><link rel="stylesheet" href="./styles.css?v=4"><style>.donate-wrap{min-height:100vh;padding:32px 5vw;background:#f3f0e8}.donate-card{max-width:720px;margin:auto;background:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 60px #0d2f2818}.donate-card h1{font-size:clamp(32px,6vw,52px);margin:8px 0}.donate-card p{color:#6d7774;line-height:1.8}.donate-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid #dfe5e1;border-radius:13px;background:#fff;font:inherit}.field textarea{resize:vertical}.submit{grid-column:1/-1;border:0;border-radius:999px;padding:15px;background:#d7aa4b;font-weight:700;cursor:pointer}.result{grid-column:1/-1;padding:16px;border-radius:14px;display:none}.result.ok{display:block;background:#e4f1eb;color:#28624f}.result.bad{display:block;background:#f9e7e7;color:#a72f2f}.topbar{max-width:720px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center}.topbar a{border:1px solid #cdd7d2;border-radius:999px;padding:10px 16px}@media(max-width:700px){.donate-form{grid-template-columns:1fr}.field.full,.submit,.result{grid-column:1}.donate-card{padding:24px 18px}}</style></head><body><main class="donate-wrap"><div class="topbar"><a id="back" href="./?lang=ar">العودة إلى الموقع</a><div class="lang"><a href="./donate.html?lang=ar">العربية</a><a href="./donate.html?lang=en">English</a></div></div><section class="donate-card"><span class="eyebrow" id="eyebrow">المرحلة الثالثة</span><h1 id="title">تبرع لبُنْيَان</h1><p id="intro">سجّل تبرعك وارفع صورة الإيصال إن وجدت. سيصدر لك رقم سند تلقائي للمراجعة.</p><form id="form" class="donate-form"><div class="field"><label id="donorLabel" for="donor">اسم المتبرع</label><input id="donor" name="donor" required maxlength="120"></div><div class="field"><label id="phoneLabel" for="phone">رقم الهاتف</label><input id="phone" name="phone" maxlength="40"></div><div class="field"><label id="amountLabel" for="amount">المبلغ</label><input id="amount" name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label id="currencyLabel" for="currency">العملة</label><select id="currency" name="currency"><option>SDG</option><option>SAR</option><option>USD</option></select></div><div class="field full"><label id="projectLabel" for="projectId">المشروع (اختياري)</label><select id="projectId" name="projectId"><option value="">تبرع عام</option></select></div><div class="field"><label id="methodLabel" for="method">طريقة الدفع</label><input id="method" name="method" maxlength="100" placeholder="تحويل بنكي / نقدي"></div><div class="field"><label id="referenceLabel" for="reference">رقم العملية</label><input id="reference" name="reference" maxlength="160"></div><div class="field full"><label id="receiptLabel" for="receipt">صورة الإيصال (اختياري)</label><input id="receipt" name="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><button class="submit" id="submit" type="submit">إرسال التبرع</button><div id="result" class="result"></div></form></section></main><script>(()=>{'use strict';const API=['https://api.bunyan-sudan.org','https://bunyan-api-qhkf.onrender.com'];const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';const c={ar:{back:'العودة إلى الموقع',eyebrow:'المرحلة الثالثة',title:'تبرع لبُنْيَان',intro:'سجّل تبرعك وارفع صورة الإيصال إن وجدت. سيصدر لك رقم سند تلقائي للمراجعة.',donor:'اسم المتبرع',phone:'رقم الهاتف',amount:'المبلغ',currency:'العملة',project:'المشروع (اختياري)',method:'طريقة الدفع',reference:'رقم العملية',receipt:'صورة الإيصال (اختياري)',submit:'إرسال التبرع',general:'تبرع عام',sending:'جارٍ الإرسال...',success:'تم استلام التبرع. رقم السند:',error:'تعذر إرسال التبرع الآن.'},en:{back:'Back to website',eyebrow:'Phase Three',title:'Donate to BUNYAN',intro:'Register your donation and upload a receipt if available. A receipt number will be generated for review.',donor:'Donor name',phone:'Phone number',amount:'Amount',currency:'Currency',project:'Project (optional)',method:'Payment method',reference:'Transaction reference',receipt:'Receipt image (optional)',submit:'Submit Donation',general:'General donation',sending:'Submitting...',success:'Donation received. Receipt number:',error:'Unable to submit donation now.'}}[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';back.textContent=c.back;back.href='./?lang='+lang;eyebrow.textContent=c.eyebrow;title.textContent=c.title;intro.textContent=c.intro;donorLabel.textContent=c.donor;phoneLabel.textContent=c.phone;amountLabel.textContent=c.amount;currencyLabel.textContent=c.currency;projectLabel.textContent=c.project;methodLabel.textContent=c.method;referenceLabel.textContent=c.reference;receiptLabel.textContent=c.receipt;submit.textContent=c.submit;projectId.options[0].textContent=c.general;async function request(path,options){let last;for(const origin of API){try{const r=await fetch(origin+path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||String(r.status));return d}catch(e){last=e}}throw last}request('/api/public/projects',{cache:'no-store'}).then(rows=>{for(const p of rows){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;projectId.append(o)}}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;submit.textContent=c.sending;result.className='result';result.textContent='';const fd=new FormData(form);const selected=projectId.options[projectId.selectedIndex];if(projectId.value)fd.append('projectName',selected.textContent);try{const d=await request('/api/public/donations',{method:'POST',body:fd});result.className='result ok';result.textContent=c.success+' '+d.receipt_number;form.reset()}catch(err){console.error(err);result.className='result bad';result.textContent=c.error}finally{submit.disabled=false;submit.textContent=c.submit}});})();</script></body></html>

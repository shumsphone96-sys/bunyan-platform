<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#071a17"><title>طلب مساعدة | بُنْيَان</title><link rel="stylesheet" href="./styles.css?v=3"></head><body><header><a class="brand" href="./?lang=ar"><span class="mark">ب</span><span><strong>بُنْيَان</strong><small id="brandSub">مؤسسة شمس الأنبياء للتنمية</small></span></a><div class="lang"><a href="./help.html?lang=ar" data-lang="ar">العربية</a><a href="./help.html?lang=en" data-lang="en">English</a></div></header><main class="form-page"><section class="request-card"><span class="eyebrow" id="eyebrow">خدمة إنسانية موثّقة</span><h1 id="pageTitle">طلب مساعدة</h1><p id="intro">أدخل بيانات الحالة بدقة. سيظهر لك رقم متابعة فور إرسال الطلب.</p><form id="helpForm" class="request-form"><label><span id="nameLabel">الاسم الكامل</span><input name="fullName" required minlength="2" maxlength="160"></label><label><span id="phoneLabel">رقم الهاتف</span><input name="phone" required minlength="5" maxlength="40" inputmode="tel"></label><label><span id="locationLabel">الولاية / المدينة / المنطقة</span><input name="location" required minlength="2" maxlength="160"></label><label><span id="typeLabel">نوع الحالة</span><select name="caseType" required><option value="">اختر</option><option value="medical">علاجية</option><option value="education">تعليمية</option><option value="food">غذائية</option><option value="housing">سكن</option><option value="other">أخرى</option></select></label><label class="wide"><span id="descriptionLabel">وصف الحالة</span><textarea name="description" required minlength="10" maxlength="4000" rows="6"></textarea></label><label><span id="amountLabel">المبلغ المطلوب (اختياري)</span><input name="requestedAmount" type="number" min="0" step="0.01"></label><label><span id="currencyLabel">العملة</span><select name="currency"><option value="SDG">SDG</option><option value="SAR">SAR</option><option value="USD">USD</option></select></label><label class="consent wide"><input name="consent" type="checkbox" required><span id="consentLabel">أقر بأن البيانات صحيحة وأوافق على مراجعتها بواسطة إدارة بُنْيَان.</span></label><button id="submitBtn" type="submit">إرسال الطلب</button><p id="formMessage" class="message" role="status"></p></form><a class="back" id="backLink" href="./?lang=ar">العودة إلى الموقع</a></section></main><script src="./help.js?v=1"></script></body></html>

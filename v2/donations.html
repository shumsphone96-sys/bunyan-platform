<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>تبرعات بُنْيَان</title><link rel="stylesheet" href="./styles.css?v=4"></head><body class="dashboard"><header class="dash-header"><div class="brand"><span class="mark">ب</span><span><strong>بُنْيَان V2</strong><small>إدارة التبرعات</small></span></div><div style="display:flex;gap:10px"><a class="logout" id="requests" href="./dashboard.html?lang=ar">طلبات المساعدة</a><button class="logout" id="logout">تسجيل الخروج</button></div></header><main class="dash-main"><section class="dash-shell"><div class="dash-toolbar"><div><span class="eyebrow">المرحلة الثالثة</span><h1>التبرعات</h1><p>مراجعة التبرعات وتوثيقها أو رفضها.</p></div><button class="logout" style="color:#14231f;border-color:#ccd6d1" id="refresh">تحديث</button></div><div id="list" class="request-list"><p class="loading">جارٍ التحميل...</p></div></section></main><script>(()=>{'use strict';const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';const token=localStorage.getItem('bunyan_v2_token');const origin=localStorage.getItem('bunyan_v2_api_origin')||'https://api.bunyan-sudan.org';if(!token){location.replace('./admin.html?lang='+lang);return}document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';requests.href='./dashboard.html?lang='+lang;const c=lang==='ar'?{loading:'جارٍ التحميل...',empty:'لا توجد تبرعات بعد.',error:'تعذر تحميل التبرعات.',save:'حفظ',receipt:'رقم السند',project:'المشروع',method:'طريقة الدفع',reference:'المرجع',statuses:{pending:'قيد المراجعة',verified:'موثّق',rejected:'مرفوض'}}:{loading:'Loading...',empty:'No donations yet.',error:'Unable to load donations.',save:'Save',receipt:'Receipt',project:'Project',method:'Method',reference:'Reference',statuses:{pending:'Pending',verified:'Verified',rejected:'Rejected'}};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,options={}){const r=await fetch(origin+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('bunyan_v2_token');location.replace('./admin.html?lang='+lang);throw new Error('unauthorized')}if(!r.ok)throw new Error(d.error||String(r.status));return d}function card(d){const opts=Object.entries(c.statuses).map(([v,l])=>`<option value="${v}" ${d.status===v?'selected':''}>${l}</option>`).join('');return `<article class="request-item" data-id="${esc(d.id)}"><div class="row"><div><span class="status-pill">${esc(d.receipt_number||'—')}</span><h3>${esc(d.donor)}</h3></div><strong>${Number(d.amount).toLocaleString(lang==='ar'?'ar-SD':'en-GB')} ${esc(d.currency)}</strong></div><p>${c.project}: ${esc(d.project_name||'—')} — ${c.method}: ${esc(d.method||'—')} — ${c.reference}: ${esc(d.reference||'—')}</p><div class="request-actions"><select class="status-select">${opts}</select><button class="save-btn" type="button">${c.save}</button></div><p class="message item-message"></p></article>`}async function load(){list.innerHTML=`<p class="loading">${c.loading}</p>`;try{const rows=await api('/api/donations');list.innerHTML=rows.length?rows.map(card).join(''):`<p class="loading">${c.empty}</p>`;document.querySelectorAll('.save-btn').forEach(b=>b.onclick=save)}catch(e){console.error(e);list.innerHTML=`<p class="loading error">${c.error}</p>`}}async function save(e){const item=e.currentTarget.closest('.request-item');try{await api('/api/donations/'+item.dataset.id,{method:'PATCH',body:JSON.stringify({status:item.querySelector('.status-select').value})});await load()}catch(err){item.querySelector('.item-message').textContent=c.error}}refresh.onclick=load;logout.onclick=()=>{localStorage.clear();location.replace('./admin.html?lang='+lang)};load();})();</script></body></html>

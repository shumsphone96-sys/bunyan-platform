<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>دخول إدارة بُنْيَان V2</title><link rel="stylesheet" href="./styles.css?v=1"></head><body class="panel-page"><main class="card"><div class="brand"><span class="mark">ب</span><span><strong id="brand">بُنْيَان</strong><small id="sub">مؤسسة شمس الأنبياء للتنمية</small></span></div><h1 id="title">دخول لوحة الإدارة</h1><p id="intro">أدخل البريد الإلكتروني وكلمة المرور.</p><form class="form" id="loginForm"><label for="email" id="emailLabel">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password" id="passwordLabel">كلمة المرور</label><input id="password" type="password" minlength="10" autocomplete="current-password" required><button id="submitBtn" type="submit">دخول</button><div class="message" id="message" aria-live="polite"></div><a class="back" id="backLink" href="./?lang=ar">العودة إلى الموقع</a></form><div class="lang" style="margin-top:18px;justify-content:center;border-color:#dfe5e1"><a href="./admin.html?lang=ar" data-lang="ar">العربية</a><a href="./admin.html?lang=en" data-lang="en">English</a></div></main><script>(()=>{'use strict';const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';const c={ar:{brand:'بُنْيَان',sub:'مؤسسة شمس الأنبياء للتنمية',title:'دخول لوحة الإدارة',intro:'أدخل البريد الإلكتروني وكلمة المرور.',email:'البريد الإلكتروني',password:'كلمة المرور',submit:'دخول',loading:'جاري التحقق...',back:'العودة إلى الموقع',fail:'تعذر تسجيل الدخول. تحقق من البيانات أو الاتصال.'},en:{brand:'BUNYAN',sub:'Shams Al-Anbiya Foundation for Development',title:'Admin Dashboard Sign In',intro:'Enter your administrator email and password.',email:'Email Address',password:'Password',submit:'Sign In',loading:'Signing in...',back:'Back to Website',fail:'Unable to sign in. Check your details or connection.'}}[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';brand.textContent=c.brand;sub.textContent=c.sub;title.textContent=c.title;intro.textContent=c.intro;emailLabel.textContent=c.email;passwordLabel.textContent=c.password;submitBtn.textContent=c.submit;backLink.textContent=c.back;backLink.href='./?lang='+lang;document.querySelectorAll('[data-lang]').forEach(a=>a.classList.toggle('active',a.dataset.lang===lang));const saved=localStorage.getItem('bunyan_v2_token');if(saved)location.replace('./dashboard.html?lang='+lang);const origins=['https://api.bunyan-sudan.org','https://bunyan-api-qhkf.onrender.com'];loginForm.addEventListener('submit',async e=>{e.preventDefault();submitBtn.disabled=true;message.textContent=c.loading;let lastError;for(const origin of origins){try{const response=await fetch(origin+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value}),cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok||!data.token)throw new Error(data.error||data.message||c.fail);localStorage.setItem('bunyan_v2_token',data.token);localStorage.setItem('bunyan_v2_api_origin',origin);location.replace('./dashboard.html?lang='+lang);return}catch(error){lastError=error}}message.textContent=lastError?.message||c.fail;submitBtn.disabled=false})})();</script></body></html>

services:
  - type: web
    name: bunyan-cloud-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bunyan-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://shumsphone96-sys.github.io

databases:
  - name: bunyan-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: bunyan
    user: bunyan

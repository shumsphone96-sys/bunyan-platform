services:
  - type: web
    name: bunyan-cloud-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bunyan-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://shumsphone96-sys.github.io
      - key: ADMIN_PANEL_URL
        value: https://shumsphone96-sys.github.io/bunyan-platform/
      - key: NOTIFICATION_EMAIL
        value: shumsphone96@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BUNYAN <onboarding@resend.dev>
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ADMIN_NUMBER
        value: 249912930540

databases:
  - name: bunyan-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: bunyan
    user: bunyan